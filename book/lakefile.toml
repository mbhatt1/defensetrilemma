name = "TrilemmaBook"
defaultTargets = ["trilemmabook"]

# Verso supplies the live-embedded, elaborated-at-build-time book toolchain.
# Pinned to v4.28.0 to match the proof libraries' Lean toolchain.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.28.0"

# Mathlib, so that the analytic half of the book can be elaborated in these
# pages rather than only cited. Pinned to the same tag as the companion proof
# libraries; the sole shared dependency with Verso is `plausible`, which both
# resolve to the same revision.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.28.0"

# The book content library: the root document plus one module per chapter.
[[lean_lib]]
name = "TrilemmaBook"

# The generator executable: emits the multi-page HTML book and the TeX/print
# edition from the same source (see Config in TrilemmaBookMain.lean).
[[lean_exe]]
name = "trilemmabook"
root = "TrilemmaBookMain"

# The thesis content library: the thesis root plus the chapters written for it.
# The theoretical chapters are shared with `TrilemmaBook` rather than copied.
[[lean_lib]]
name = "Thesis"

# The thesis generator: same two outputs, emitted into `_out_thesis`.
[[lean_exe]]
name = "thesis"
root = "ThesisMain"

# The CTVG thesis content library: a separate, self-contained thesis proposing
# the Critical-Threshold Viability Game framework for agentic AI safety. It
# does not share chapters with `TrilemmaBook` or `Thesis` and depends only on
# core Lean, not Mathlib: its formal content is a set of structures and
# definitions, not machine-checked theorems in the sense of the companion
# corpus.
[[lean_lib]]
name = "CTVGThesis"

# The CTVG thesis generator: same HTML/PDF pipeline, emitted into
# `_out_ctvg_thesis`.
[[lean_exe]]
name = "ctvg-thesis"
root = "CTVGThesisMain"
